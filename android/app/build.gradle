// The APK of the game: the code of CMakeLists.txt at the top of the repository as libmain.so, SDL 3 from its sources
// (the folder given by -PsdlSource=... or the environment JURAIC_SDL_SOURCE: an unpacked SDL3-3.4.18.tar.gz), whose
// Java part loads it, and the pictures, the music and the font of media/ and the licences as assets (the game puts them into its own
// folder when it first starts: play/platform_sdl.h).
plugins {
    id 'com.android.application'
}

def sdlSource = project.findProperty('sdlSource') ?: System.getenv('JURAIC_SDL_SOURCE')
if (sdlSource == null) throw new GradleException('Name the unpacked SDL 3 source with -PsdlSource=<folder>')
def repository = file('../..')
def version = (file('../../CMakeLists.txt').text =~ /project\(juraic_field VERSION ([0-9.]+)/)[0][1]
def assetsFolder = layout.buildDirectory.dir('gameAssets').get().asFile

android {
    namespace = 'io.github.nikque.juraicfield'
    compileSdkVersion 35
    // (the NDK of the machine, when it names one: its folder and its version, which must agree)
    def ndkFolder = System.getenv('ANDROID_NDK_LATEST_HOME')
    if (ndkFolder != null) {
        ndkPath = ndkFolder
        ndkVersion = (new File(ndkFolder, 'source.properties').text =~ /Pkg\.Revision\s*=\s*([0-9.]+)/)[0][1]
    }
    defaultConfig {
        applicationId 'io.github.nikque.juraicfield'
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName version
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_PLATFORM=android-26', '-DANDROID_STL=c++_static', "-DJURAIC_SDL_SOURCE=${sdlSource}", '-DBUILD_TESTING=OFF'
                abiFilters(*((project.findProperty('abi') ?: 'arm64-v8a').split(',')))  // (-Pabi=x86_64: for the emulator)
                targets 'juraic_field_game', 'SDL3-shared' // (the game and SDL alone: not the tools of the repository)
            }
        }
    }
    // The key of the APKs that are given out (-PreleaseStore=<a PKCS12 file> -PreleasePassword=... -PreleaseAlias=...):
    // a version installs over the one before only when both are signed with the same key. Without it a release APK is
    // left unsigned; the debug APK is signed with the debug key of the machine.
    signingConfigs {
        release {
            if (project.hasProperty('releaseStore')) {
                storeFile file(project.property('releaseStore'))
                storeType 'pkcs12'
                storePassword project.property('releasePassword')
                keyAlias project.property('releaseAlias')
                keyPassword project.property('releasePassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty('releaseStore')) signingConfig signingConfigs.release
        }
    }
    sourceSets.main {
        java.srcDirs += "${sdlSource}/android-project/app/src/main/java"
        assets.srcDirs += assetsFolder
    }
    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
        }
    }
    lint {
        abortOnError = false
    }
}

// The files that come with the game, below "game" in the assets, and their list (game/files.txt), by which the game
// copies them out on its first start and again when the list is another (the list has the version, a digest of the
// contents, and every file with its size).
tasks.register('gameAssets') {
    inputs.dir("${repository}/media/background")
    inputs.dir("${repository}/media/bgm")
    inputs.dir("${repository}/media/fonts")
    inputs.dir("${repository}/licenses")
    inputs.file("${repository}/LICENSE")
    inputs.property('version', version) // (written into the list)
    outputs.dir(assetsFolder)
    doLast {
        delete assetsFolder
        def game = new File(assetsFolder, 'game')
        ['background', 'bgm', 'fonts'].each { kind ->
            copy {
                from "${repository}/media/${kind}"
                into new File(game, kind)
            }
        }
        // (the licences of the game and of what the APK contains, which must go with it)
        copy {
            from "${repository}/licenses"
            from "${repository}/LICENSE"
            into new File(game, 'licenses')
        }
        def names = []
        game.eachFileRecurse(groovy.io.FileType.FILES) { names << game.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
        names.sort()
        // (a SHA-256 of the names and the contents of all the files: a file replaced by another of the same name and size
        //  makes another list as well)
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        names.each { n ->
            digest.update(n.getBytes('UTF-8'))
            digest.update((byte) 0)
            new File(game, n).withInputStream { s ->
                byte[] buffer = new byte[65536]
                int read
                while ((read = s.read(buffer)) > 0) digest.update(buffer, 0, read)
            }
        }
        new File(game, 'files.txt').text = "version ${version}\ndigest ${digest.digest().encodeHex()}\n" + names.collect { n -> "${n} ${new File(game, n).length()}" }.join('\n') + '\n'
    }
}
preBuild.dependsOn 'gameAssets'
