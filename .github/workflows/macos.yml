# The macOS build (Apple Silicon): SDL 3 from its release, the game as an application bundle, the tests, the four
# checksums of AI matches against those of Windows (the AI must play the same moves on ARM), the self-test pictures,
# and the bundle, signed for this machine only (ad hoc: no developer certificate), as a zip, with the command of the
# generator.
name: macOS

on:
  push:
    branches: ['ci/v0.9.9.1-macos']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      SDL_VERSION: 3.4.18
      SDL_SHA256: 9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 20e12b1f0370443afb05fff7e3b9c3428fdb164e
      - name: Verify release source
        run: test "$(git rev-parse HEAD)" = "20e12b1f0370443afb05fff7e3b9c3428fdb164e"

      - name: SDL 3
        run: |
          curl -sSL -o sdl.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL3-$SDL_VERSION.tar.gz"
          echo "$SDL_SHA256  sdl.tar.gz" | shasum -a 256 -c
          tar xzf sdl.tar.gz
          cmake -S "SDL3-$SDL_VERSION" -B sdl-build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TESTS=OFF \
                -DSDL_EXAMPLES=OFF -DSDL_INSTALL_DOCS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/sdl3"
          cmake --build sdl-build -j 4
          cmake --install sdl-build

      - name: Instrument and train the native executables
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/profiles"
          cmake -S . -B instrumented -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_PREFIX_PATH="$PWD/sdl3" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -fprofile-instr-generate" \
            -DCMAKE_EXE_LINKER_FLAGS_RELEASE="-fprofile-instr-generate"
          cmake --build instrumented -j 4 --target juraic_field_game random_19_chain ai_match
          export LLVM_PROFILE_FILE="$RUNNER_TEMP/profiles/{program}-%m-%p.profraw"
          python3 tools/native_training.py instrumented instrumented/JuraicField.app/Contents/MacOS/JuraicField "$RUNNER_TEMP/training"
          for name in JuraicField random_19_chain ai_match; do
            xcrun llvm-profdata merge "$RUNNER_TEMP/profiles/$name"-*.profraw -o "$RUNNER_TEMP/$name.profdata"
            xcrun llvm-profdata show "$RUNNER_TEMP/$name.profdata" | tee "$name-profile.txt"
            grep -Eq 'Maximum function count: [1-9][0-9]*' "$name-profile.txt"
          done
          xcrun llvm-profdata merge "$RUNNER_TEMP"/*.profdata -o "$RUNNER_TEMP/combined.profdata"

      - name: Build with the measured profiles
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/sdl3" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -fprofile-instr-use=$RUNNER_TEMP/combined.profdata -Werror=profile-instr-out-of-date"
          cmake --build build -j 4 --verbose --target juraic_field_game random_19_chain ai_match 2>&1 | tee build.log
          grep -F -- "-fprofile-instr-use=$RUNNER_TEMP/combined.profdata" build.log > profile-compile.log
          test -s profile-compile.log
          python3 tools/native_training.py build build/JuraicField.app/Contents/MacOS/JuraicField "$RUNNER_TEMP/training" --recheck

      - name: Tests
        run: |
          set -euo pipefail
          cmake -S . -B test-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/sdl3"
          cmake --build test-build -j 4 --target game_tests frame_tests
          ctest --test-dir test-build --output-on-failure -R '^(game_rules|game_frames)$'
          ctest --test-dir build --output-on-failure -R '^(ai_match_same_result|replay_as_on_windows_.*)$'

      - name: Checksums of AI matches (the same as on Windows)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          # Current settings and the four corresponding Windows reference checksums.
          common="--pairs 20 --threads 8 --seed 71 --param beamWidth=40 --param beamDepth=10 --param beamQueues=3"
          old=""
          for p in evFireHeight=300 x3PokeGain=75 xWildChance=0 xWildEvery=2 x3PokeNet=0 x3PokeFrom=0 x3KeepMain=85 x3Crowd=1000; do old="$old --param-b $p"; done
          check() {
            name=$1; want=$2; shift 2
            got=$(build/ai_match $common "$@" | grep '^checksum' | head -1 | awk '{print $2}')
            echo "$name : $got (Windows: $want)" | tee -a checksums.txt
            [ "$got" = "$want" ]
          }
          ok=0
          check "x3 x3" ecc86ea94bf53201 --a x3 --b x3 || ok=1
          check "x3 random" 5a7f949a20f0685b --a x3 --b random || ok=1
          check "x3 x3 old" f7fff8892f0c1da1 --a x3 --b x3 $old || ok=1
          check "x3 x3 hold" ec860029039d6436 --a x3 --b x3 --param-a x3BuildHold=1 || ok=1
          exit $ok

      - name: Self tests of the game
        if: always()
        run: |
          mkdir -p shots
          game=build/JuraicField.app/Contents/MacOS/JuraicField
          for mode in 0 -1 -2 -3 -4 -6 -11 -12 -13 -14 600 601 611 602 3003 3015 30004 30014 30005 30006 30008; do
            mkdir -p shots/m$mode
            ( cd shots/m$mode && "$OLDPWD/$game" --screenshot shot.png $mode > log.txt 2>&1 ); echo "$mode exit $?" | tee -a shots/exits.txt
          done

      - name: Bundle
        run: |
          codesign --force --deep --sign - build/JuraicField.app
          codesign --verify --deep --strict build/JuraicField.app && echo "signature: ad hoc, whole"
          dist="$RUNNER_TEMP/juraic-macos"
          mkdir -p "$dist"
          ditto build/JuraicField.app "$dist/JuraicField.app"
          cp build/random_19_chain config.ini README.md README.en.md CHANGELOG.md GENERATOR.md GENERATOR.en.md LICENSE "$dist/"
          cp -R licenses examples "$dist/"
          ditto -c -k --sequesterRsrc "$dist" JuraicField-macos-arm64.zip
          expanded="$RUNNER_TEMP/macos-extracted"
          ditto -x -k JuraicField-macos-arm64.zip "$expanded"
          codesign --verify --deep --strict "$expanded/JuraicField.app"
          cmp build/random_19_chain "$expanded/random_19_chain"
          cmp build/JuraicField.app/Contents/MacOS/JuraicField "$expanded/JuraicField.app/Contents/MacOS/JuraicField"
          cp tests/fixtures/replays/ai-match-1.jfreplay* "$RUNNER_TEMP/"
          "$expanded/JuraicField.app/Contents/MacOS/JuraicField" --check-replay-expected "$RUNNER_TEMP/ai-match-1.jfreplay"
          plutil -p build/JuraicField.app/Contents/Info.plist | grep -E 'HighResolution|MinimumSystem|ShortVersion'
          otool -l build/JuraicField.app/Contents/MacOS/JuraicField | grep -A3 LC_BUILD_VERSION | grep -E 'minos|sdk'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-results
          path: |
            build.log
            profile-compile.log
            *-profile.txt
            checksums.txt
            shots
            JuraicField-macos-arm64.zip
            build/random_19_chain
