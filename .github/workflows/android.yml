# The Android build (arm64): SDL 3 from its release, the game as libmain.so in an APK with SDL's Java part, signed
# with the debug key of the machine that builds it (for trying it; each run has another key), kept as an artifact.
name: Android

on:
  push:
    branches: ['ci/v0.9.9-android']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SDL_VERSION: 3.4.18
      SDL_SHA256: 9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ab1df93a1e534e2e09accd7dfa990ebc63d5b1a8
      - name: Verify release source
        run: test "$(git rev-parse HEAD)" = "ab1df93a1e534e2e09accd7dfa990ebc63d5b1a8"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: SDL 3
        run: |
          curl -sSL -o sdl.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL3-$SDL_VERSION.tar.gz"
          echo "$SDL_SHA256  sdl.tar.gz" | sha256sum -c
          tar xzf sdl.tar.gz -C "$RUNNER_TEMP"
          echo "JURAIC_SDL_SOURCE=$RUNNER_TEMP/SDL3-$SDL_VERSION" >> "$GITHUB_ENV"
          # (the Gradle wrapper of SDL's Android project)
          cp -r "$RUNNER_TEMP/SDL3-$SDL_VERSION/android-project/gradlew" "$RUNNER_TEMP/SDL3-$SDL_VERSION/android-project/gradle" android/
          echo "NDK: $ANDROID_NDK_LATEST_HOME"

      - name: Use the Google Cloud mirror of Maven Central
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/central.gradle" <<'GRADLE'
          beforeProject { project ->
              [project.buildscript.repositories, project.repositories].each { repos ->
                  repos.google()
                  repos.maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
                  repos.withType(org.gradle.api.artifacts.repositories.MavenArtifactRepository).all { repository ->
                      if (repository.url?.host in ["repo.maven.apache.org", "repo1.maven.org"]) {
                          repository.url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                      }
                  }
              }
          }
          GRADLE
          curl --fail --silent --show-error --retry 3 -o "$RUNNER_TEMP/kotlin.pom" "https://maven-central.storage-download.googleapis.com/maven2/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.20/kotlin-stdlib-jdk8-1.9.20.pom"

      - name: APK
        working-directory: android
        env:
          RELEASE_KEY: ${{ secrets.ANDROID_RELEASE_KEY }}
          RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --init-script "$RUNNER_TEMP/central.gradle" --no-daemon assembleDebug 2>&1 | tee ../gradle.log
          # (the APK to give out, signed with the key of the repository's secrets when they are there; the file of the
          #  key is in the temporary folder of the job, which goes with it)
          if [ -n "$RELEASE_KEY" ]; then
            echo "$RELEASE_KEY" | base64 -d > "$RUNNER_TEMP/release.p12"
            ./gradlew --init-script "$RUNNER_TEMP/central.gradle" --no-daemon assembleRelease -PreleaseStore="$RUNNER_TEMP/release.p12" -PreleasePassword="$RELEASE_PASSWORD" -PreleaseAlias=juraicfield 2>&1 | tee -a ../gradle.log
            ls -l app/build/outputs/apk/release/
            # (the signature checked, and whose it is)
            apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee ../apk-signature.txt
            apk=app/build/outputs/apk/release/app-release.apk
            unzip -Z1 "$apk" > ../release-files.txt
            grep -Fxq lib/arm64-v8a/libmain.so ../release-files.txt
            grep -Fxq lib/arm64-v8a/libSDL3.so ../release-files.txt
            test "$(awk -F/ '/^lib\/[^/]+\/[^/]+$/ {print $2}' ../release-files.txt | sort -u)" = arm64-v8a
            unzip -p "$apk" assets/game/files.txt > ../release-assets.txt
            test -s ../release-assets.txt
            sha256sum "$apk" > ../release-sha256.txt
          else
            echo "A tagged Android distribution requires the repository signing key." >&2
            exit 1
          fi
          echo "warnings of the game's code: $(grep -c 'puyo-19-chain-generator.*warning:\|juraic-field.*warning:' ../gradle.log || true)"
          ls -l app/build/outputs/apk/debug/

      - name: What is in the APK
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/|assets/game/files.txt|classes|AndroidManifest' | tee apk-contents.txt
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/game/files.txt | tee -a apk-contents.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            gradle.log
            apk-contents.txt
            apk-signature.txt
            release-files.txt
            release-assets.txt
            release-sha256.txt
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/*.apk

